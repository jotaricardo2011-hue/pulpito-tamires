<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e131b">
<title>Púlpito da Tamires</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#f3f6fa;--ink:#111827;--muted:#6b7280;--faint:#9aa3af;--line:#e8edf3;--pri:#1d5fc4;--pri-soft:#e9f1fd;--on-pri:#fff;--ok:#1f7a4d;--warn:#a15c07;--danger:#c0362c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e131b;--soft:#18202c;--ink:#e8edf5;--muted:#9aa6b8;--faint:#6b778a;--line:#222b39;--pri:#6ea8ff;--pri-soft:#18294a;--on-pri:#0a1222;--ok:#5fd39a;--warn:#f0b45a;--danger:#ff8a80}}
:root[data-theme=dark]{--bg:#0e131b;--soft:#18202c;--ink:#e8edf5;--muted:#9aa6b8;--faint:#6b778a;--line:#222b39;--pri:#6ea8ff;--pri-soft:#18294a;--on-pri:#0a1222;--ok:#5fd39a;--warn:#f0b45a;--danger:#ff8a80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Inter,system-ui,sans-serif}
body.travado{overflow:hidden}
[hidden]{display:none!important}
.cap::first-letter{text-transform:uppercase}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4,p{margin:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.serif{font-family:Lora,Georgia,serif}

/* topo e abas */
.topo{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:4px;padding:calc(12px + env(safe-area-inset-top)) 12px 10px 16px}
.topo h1{flex:1;font-size:21px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.ic.azul{color:var(--pri)}
.ic:active{background:var(--soft)}
#voltar{margin-left:-8px}
main{max-width:720px;margin:0 auto;padding:4px 20px calc(100px + env(safe-area-inset-bottom))}
.abas{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.aba{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 0 7px;font-size:11.5px;font-weight:500;color:var(--faint)}
.aba.on{color:var(--pri)}

/* peças */
.muted{color:var(--muted)}
.azul{color:var(--pri)}
.rot{font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin:28px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;font-weight:500;background:var(--soft);text-align:center}
.btn:active{opacity:.8}
.btn.pri{background:var(--pri);color:var(--on-pri)}
.btn.bloco{width:100%}
.btn.perigo{color:var(--danger)}
.lnk{color:var(--pri);font-weight:500;display:inline-flex;align-items:center;gap:6px;padding:6px 0}
.vazio{text-align:center;color:var(--muted);padding:48px 12px}
.vazio b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
.warn{color:var(--warn)}.ok{color:var(--ok)}.perigo{color:var(--danger)}

/* linhas de lista */
.linha{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line)}
.linha:active{opacity:.7}
.linha .info{flex:1;min-width:0}
.linha .t{font-weight:500;font-size:16.5px;line-height:1.35}
.linha .s{color:var(--muted);font-size:14px;margin-top:2px}
.linha .ref{color:var(--pri);font-size:14px;margin-top:2px}
.linha .x{font-size:13px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.linha.cancel .t{text-decoration:line-through;color:var(--faint)}
.dia{flex:none;width:44px;text-align:center;padding-top:1px}
.dia b{display:block;font-size:22px;font-weight:600;line-height:1.05;color:var(--pri)}
.dia span{font-size:11.5px;font-weight:500;color:var(--faint);text-transform:uppercase}
.mes-t{font-size:14px;font-weight:600;color:var(--muted);margin:24px 0 2px}

/* início */
.ola{margin:6px 0 4px}
.ola h2{font:500 28px/1.2 Lora,Georgia,serif;letter-spacing:-.01em}
.ola p{color:var(--muted);margin-top:4px}
.prox{display:block;padding:18px 0 20px;border-bottom:1px solid var(--line)}
.prox .q{font-size:13px;font-weight:600;color:var(--pri)}
.prox h3{font:500 24px/1.25 Lora,Georgia,serif;margin:6px 0 4px}
.prox p{color:var(--muted)}
.prox .e{margin-top:10px;font-size:15px;display:flex;gap:8px;align-items:center}
.aviso{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.aviso i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:8px;background:var(--warn)}
.aviso i.perigo{background:var(--danger)}
.aviso b{font-weight:600}
.aviso .lnk{font-size:15px;padding:2px 0 0}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums div b{display:block;font:500 30px/1.1 Lora,Georgia,serif;color:var(--pri)}
.nums div span{font-size:13px;color:var(--muted)}

/* busca e filtros */
.busca{position:relative;margin:6px 0 4px}
.busca input{width:100%;height:46px;border-radius:12px;border:0;background:var(--soft);padding:0 14px 0 42px;outline:none}
.busca input:focus{box-shadow:0 0 0 2px var(--pri)}
.busca svg{position:absolute;left:12px;top:12px;color:var(--faint)}
.sub{display:flex;align-items:center;gap:18px;margin:12px 0 2px;border-bottom:1px solid var(--line)}
.sub button{padding:8px 0;font-size:15px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.sub button.on{color:var(--pri);border-color:var(--pri)}
.sub .dir{margin-left:auto;display:flex;align-items:center;gap:6px}
.ativos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;margin:10px 0 0;color:var(--muted)}
.ativos b{color:var(--ink);font-weight:500}

/* formulários */
.form{display:flex;flex-direction:column;gap:14px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo>span{font-size:13.5px;font-weight:500;color:var(--muted)}
.campo input,.campo select,.campo textarea,.topico input,.topico textarea{width:100%;border:0;background:var(--soft);border-radius:12px;padding:12px 13px;outline:none}
.campo input:focus,.campo select:focus,.campo textarea:focus,.topico input:focus,.topico textarea:focus{box-shadow:0 0 0 2px var(--pri)}
textarea{min-height:88px;resize:none;line-height:1.5}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:10px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--pri)}
.bloco-t{font:500 19px Lora,Georgia,serif;margin:22px 0 2px}
.topico{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.topico-h{display:flex;gap:10px;align-items:center}
.topico-h b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-size:14px;font-weight:600}
.topico-h input{font-weight:500}
.mini{display:flex;gap:4px;justify-content:flex-end}
.mini button{height:34px;padding:0 10px;border-radius:9px;color:var(--muted);font-size:14px;font-weight:500}
.mini button:active{background:var(--soft)}
.mini button[disabled]{opacity:.3}
.salvar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:4;background:var(--bg);border-top:1px solid var(--line);padding:10px 20px}
.salvar .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
/* ditado: gravar e transcrever */
.salvar .in.com-mic{grid-template-columns:1fr 1.6fr 48px}
.mic{width:48px;height:48px;border-radius:50%;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;flex:none}
.mic:active{opacity:.8}
.gravando{max-width:680px;margin:0 auto}
.gravando .lin{display:flex;align-items:center;gap:10px}
.gravando .caixa{flex:1;min-width:0;background:color-mix(in srgb,var(--danger) 13%,var(--bg));border-radius:24px;padding:0 14px;height:48px;display:flex;align-items:center;gap:10px;font-weight:500;font-variant-numeric:tabular-nums}
.gravando .ponto{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pisca 1s infinite;flex:none}
.gravando .ondas{flex:1;display:flex;align-items:center;gap:2px;height:26px;overflow:hidden;justify-content:flex-end}
.gravando .ondas i{width:3px;flex:none;border-radius:2px;background:var(--danger);opacity:.75;height:3px}
.gravando .mic{background:var(--danger);color:#fff}
.gravando .dest{font-size:13px;color:var(--muted);margin:0 0 8px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gravando .dest b{color:var(--pri);font-weight:600}
.ditando{box-shadow:0 0 0 2px var(--pri)!important}
@keyframes pisca{50%{opacity:.2}}
.ouvir{margin:18px 0 4px;padding:14px;border-radius:16px;background:var(--soft)}
.ouvir .lin{display:flex;align-items:center;gap:12px}
.ouvir .tocar{width:46px;height:46px;border-radius:50%;background:var(--pri);color:var(--on-pri);display:grid;place-items:center;flex:none}
.ouvir .barra{flex:1;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.ouvir .barra i{position:absolute;left:0;top:0;bottom:0;background:var(--pri);border-radius:3px;width:0}
.ouvir .tempo{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ouvir .vel{display:flex;gap:6px;margin-top:12px;align-items:center}
.ouvir .vel button{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--muted)}
.ouvir .vel button.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.ouvir .vel .volta{margin-left:auto;border:0;color:var(--pri)}
.nota{font-size:14px;padding:4px 0}
.modelo{display:block;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--line)}
.modelo b{display:block;font:500 19px Lora,Georgia,serif}
.modelo span{color:var(--muted);font-size:14.5px}

/* leitura do esboço */
.esb-h h2{font:500 29px/1.2 Lora,Georgia,serif;letter-spacing:-.01em}
.esb-h .ref{display:inline-block;color:var(--pri);font-weight:500;margin-top:8px;font-size:17px}
.meta{color:var(--muted);font-size:14px;margin-top:6px}
.acoes{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin:20px 0 4px}
.acoes .btn{min-height:46px}
.sec{margin-top:26px}
.sec h3{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.sec p{white-space:pre-wrap}
.tops{list-style:none;padding:0;margin:0}
.tops li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.tops li:last-child{border-bottom:0}
.tops .n{flex:none;font:500 22px/1.2 Lora,Georgia,serif;color:var(--pri);width:20px}
.tops h4{font:500 19px/1.3 Lora,Georgia,serif}
.tops p{white-space:pre-wrap;margin-top:4px}
.vrefs{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.vref{color:var(--pri);font-weight:500;font-size:14.5px;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--pri) 35%,transparent);text-underline-offset:3px}

/* convite */
.conv-h .q{font-size:13px;font-weight:600;color:var(--pri)}
.conv-h h2{font:500 27px/1.2 Lora,Georgia,serif;margin:6px 0 4px}
.conv-h .d{color:var(--muted)}
.botoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0 6px}
.botoes .btn{min-height:46px;font-size:15px}
.dado{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.dado .r{flex:none;width:96px;color:var(--muted);font-size:14px}
.dado .v{flex:1;white-space:pre-wrap;word-break:break-word}

/* calendário */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.cal-h b{font-weight:600;font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .ds{font-size:11.5px;font-weight:500;color:var(--faint);padding:6px 0;text-transform:uppercase}
.cal button{aspect-ratio:1;border-radius:50%;font-weight:500;position:relative;font-size:15px}
.cal button.vz{visibility:hidden}
.cal button.hoje{color:var(--pri);font-weight:700}
.cal button.sel{background:var(--pri);color:var(--on-pri)}
.cal button i{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--pri)}
.cal button.sel i{background:var(--on-pri)}

/* bíblia */
.livros{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.livros a{padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:8px}
.caps a{aspect-ratio:1;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:500}
.caps a:active{background:var(--pri-soft)}
.leitura{font-family:Lora,Georgia,serif;font-size:var(--bf,19px);line-height:1.75}
.leitura p{margin:0;padding:3px 6px;border-radius:8px;cursor:pointer}
.leitura p.sel{background:var(--pri-soft)}
.leitura p.alvo{background:color-mix(in srgb,var(--pri-soft) 70%,transparent)}
.leitura sup{font-family:Inter,sans-serif;font-size:.58em;font-weight:600;color:var(--pri);margin-right:4px;vertical-align:.45em}
.nav-cap{display:flex;justify-content:space-between;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.selbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:4;background:var(--ink);color:var(--bg);padding:10px 14px;display:flex;align-items:center;gap:6px}
.selbar span{flex:1;font-size:14.5px;font-weight:500}
.selbar button{padding:8px 10px;border-radius:10px;font-weight:600;font-size:14.5px}
.creditos{font-size:12.5px;color:var(--faint);margin-top:28px;line-height:1.5}
.creditos a{text-decoration:underline}
.verso-pop{font-family:Lora,Georgia,serif;font-size:17px;line-height:1.7;max-height:52vh;overflow:auto;margin-bottom:14px}
.verso-pop sup{font-family:Inter,sans-serif;font-size:.6em;font-weight:600;color:var(--pri);margin-right:4px}

/* janelas */
.fundo{position:fixed;inset:0;z-index:20;background:rgba(8,12,20,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:600px){.fundo{align-items:center;padding:16px}}
.janela{background:var(--bg);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:86vh;overflow:auto}
@media (min-width:600px){.janela{border-radius:22px}}
.janela h3{font:500 20px Lora,Georgia,serif;margin-bottom:6px}
.janela>p{margin:0 0 16px;color:var(--muted);white-space:pre-wrap}
.janela .bts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:14px;padding:14px 4px;font-weight:500;text-align:left;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0;justify-content:center;color:var(--muted)}
.menu button small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* modo púlpito */
#pulpito{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:#fff;color:#111827;--pf:28px;--pa:#1d5fc4;--pl:#e8edf3;--pm:#6b7280}
#pulpito.escuro{background:#0b111b;color:#eef3fb;--pa:#7cb3ff;--pl:#1f2a3a;--pm:#9aa6b8}
.p-top{display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 10px 6px}
.p-top button{min-width:44px;height:44px;border-radius:12px;font-weight:600;font-size:17px;color:inherit}
.p-info{flex:1;display:flex;gap:16px;justify-content:center;font-size:15px;font-weight:500;color:var(--pm);font-variant-numeric:tabular-nums}
.p-barra{height:2px;background:var(--pl)}
.p-barra i{display:block;height:100%;background:var(--pa);transition:width .2s}
.p-corpo{flex:1;overflow-y:auto;padding:22px 28px 30px;font-size:var(--pf);line-height:1.5;user-select:none}
.p-rot{font:600 calc(var(--pf)*.46)/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--pa);margin:4px 0 16px}
.p-corpo h2{font:500 calc(var(--pf)*1.3)/1.2 Lora,Georgia,serif;margin:0 0 14px}
.p-vers{color:var(--pa);font-weight:500;margin:0 0 6px;font-size:calc(var(--pf)*.75)}
.p-texto{font:400 calc(var(--pf)*.72)/1.6 Lora,Georgia,serif;color:var(--pm);border-left:2px solid var(--pa);padding-left:14px;margin:0 0 18px}
.p-texto sup{font-family:Inter,sans-serif;font-size:.6em;font-weight:600;color:var(--pa);margin-right:3px}
.p-corpo p.b{margin:0 0 14px;white-space:pre-wrap}
.p-capa{display:flex;flex-direction:column;justify-content:center;min-height:100%;text-align:center}
.p-capa h2{font-size:calc(var(--pf)*1.55)}
.p-capa .p-texto{text-align:left;border-left:0;padding:0;margin-top:10px}
.p-pe{display:flex;align-items:center;gap:8px;padding:8px 14px calc(12px + env(safe-area-inset-bottom))}
.p-pe button{flex:1;height:52px;border-radius:14px;font-weight:600;font-size:17px;color:inherit;background:var(--pl)}
.p-pe button.pri{background:var(--pa);color:#fff}
#pulpito.escuro .p-pe button.pri{color:#0b111b}
.p-pe button[disabled]{opacity:.35}
.p-pe span{flex:none;min-width:58px;text-align:center;font-weight:500;color:var(--pm)}

@media print{
  .topo,.abas,.acoes,.hist,.salvar,#toast,.selbar{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
}
</style>
</head>
<body>
<header class="topo">
  <button class="ic" id="voltar" aria-label="Voltar" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 id="titulo">Púlpito da Tamires</h1>
  <div id="topo-acao" style="display:flex"></div>
</header>
<main id="tela"></main>
<nav class="abas">
  <a class="aba" data-aba="inicio" href="#/inicio"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Início</a>
  <a class="aba" data-aba="esbocos" href="#/esbocos"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>Esboços</a>
  <a class="aba" data-aba="biblia" href="#/biblia"><svg class="i" viewBox="0 0 24 24"><path d="M5 4a2 2 0 0 1 2-2h12v17H7a2 2 0 0 0-2 2z"/><path d="M5 21V4M12 6v7M9.5 8.5h5"/></svg>Bíblia</a>

const NOMES_N = LIVROS.map(l => norm(l).replace(/\s+/g, ''));

  if (!k) return -1;

function lerRefs(txt) {
  const out = []; let ultimo = -1;
  for (const parte of String(txt || '').split(/[;\n]+/)) {
    const p = parte.trim(); if (!p) continue;
    let m = p.match(/^(\d?\s*[^\d\s:.,;–-][^\d:;]*?)\s*(\d+)(?:\s*[:.]\s*(\d+)(?:\s*[-–]\s*(\d+))?)?\s*$/);

/* ================= Ditado: gravar o áudio e escrever no esboço ao mesmo tempo =================
   Áudios ficam no IndexedDB (o localStorage é pequeno demais): um registro por esboço
   { id: <id do esboço>, clips: [{ blob, ms }] }. Vários clips tocam em sequência, como um áudio só. */
const AUD = {
  _db: null,
  abrir() {
    return this._db ||= new Promise((ok, erro) => {
      const r = indexedDB.open('pulpito_audios', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('audios', { keyPath: 'id' });
      r.onsuccess = () => ok(r.result); r.onerror = () => erro(r.error);
    });
  },
  async op(modo, fn) {
    const d = await this.abrir();
    return new Promise((ok, erro) => {
      const tx = d.transaction('audios', modo), req = fn(tx.objectStore('audios'));
      tx.oncomplete = () => ok(req.result); tx.onerror = () => erro(tx.error); tx.onabort = () => erro(tx.error);
    });
  },
  get(id) { return this.op('readonly', s => s.get(id)).catch(() => null); },
  put(rec) { return this.op('readwrite', s => s.put(rec)); },
  del(id) { return this.op('readwrite', s => s.delete(id)).catch(() => {}); },
};
const durTxt = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + pad(s % 60); };
const audTotal = rec => (rec?.clips || []).reduce((s, c) => s + c.ms, 0);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const PODE_GRAVAR = !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
let ditado = null, tocador = null;

// Comandos falados para pontuar: "vírgula", "ponto final", "dois pontos", "nova linha"…
function pontuar(t) {
  return t.replace(/\s*\bponto de interroga[çc][ãa]o\b/gi, '?')
    .replace(/\s*\bponto de exclama[çc][ãa]o\b/gi, '!')
    .replace(/\s*\bponto final\b/gi, '.')
    .replace(/\s*\bv[íi]rgula\b/gi, ',')
    .replace(/\s*\bdois pontos\b/gi, ':')
    .replace(/\s*\b(nova linha|pr[óo]xima linha|novo par[áa]grafo)\b\s*/gi, '\n')
    .replace(/[ \t]+([,.:?!])/g, '$1');
}
const ROT_CAMPO = { titulo: 'Título', texto: 'Texto base', tema: 'Tema', serie: 'Série', tags: 'Palavras-chave', introducao: 'Introdução', ilustracoes: 'Ilustrações', aplicacao: 'Aplicação', apelo: 'Apelo', conclusao: 'Conclusão' };
function rotCampo(el) {
  if (!el) return '';
  if (el.dataset.ti != null) return `Tópico ${+el.dataset.ti + 1} · ${{ titulo: 'título', versiculos: 'versículos', conteudo: 'explicação' }[el.dataset.tk] || ''}`;
  return ROT_CAMPO[el.name] || 'campo';
}
const ditavel = el => !!el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type === 'text'));

async function comecarDitado({ esbId, barra, form, alvo, usarCursor, novo, aoGravar, aoParar }) {
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
  catch (x) { toast(x.name === 'NotAllowedError' ? 'Libere o microfone para o app nas permissões do Chrome' : 'Não foi possível usar o microfone'); return; }
  const tipo = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  let rec;
  try { rec = new MediaRecorder(stream, tipo ? { mimeType: tipo, audioBitsPerSecond: 64000 } : {}); }
  catch (x) { rec = new MediaRecorder(stream); }
  const pedacos = []; rec.ondataavailable = e => { if (e.data && e.data.size) pedacos.push(e.data); };
  const fim = new Promise(ok => { rec.onstop = ok; });
  const t0 = Date.now();
  let ativo = true, semTexto = !SR, aviso = SR ? '' : 'Este navegador só grava o áudio, sem escrever.', trava = null;
  try { trava = await navigator.wakeLock?.request('screen'); } catch (x) { trava = null; }

  // ---- onde o texto entra ----
  let el = null, antes = '', depois = '', escrito = '', parcial = '';
  const desenhar = () => {
    const dest = aviso ? `<span class="warn">${esc(aviso)}</span>` : semTexto ? 'Gravando o áudio' : `Escrevendo em: <b>${esc(rotCampo(el))}</b> · toque em outro campo para mudar`;
    barra.innerHTML = `<div class="gravando"><div class="dest">${dest}</div><div class="lin"><div class="caixa"><span class="ponto"></span><span id="crono">${durTxt(Date.now() - t0)}</span><div class="ondas">${'<i></i>'.repeat(30)}</div></div><button class="mic" id="parar" aria-label="Parar a gravação">${IC.parar}</button></div></div>`;
    $('#parar', barra).onclick = () => parar();
  };
  const mirar = (novoEl, comCursor) => {
    if (el) el.classList.remove('ditando');
    el = novoEl; escrito = ''; parcial = '';
    const a = comCursor && el.selectionStart != null ? el.selectionStart : el.value.length;
    const b = comCursor && el.selectionEnd != null ? el.selectionEnd : el.value.length;
    antes = el.value.slice(0, a); depois = el.value.slice(b);
    el.classList.add('ditando'); el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    desenhar();
  };
  const escrever = () => {
    if (!el) return;
    const novoTxt = escrito + parcial, sep = antes && novoTxt && !/\s$/.test(antes) && !/^[,.:?!\n]/.test(novoTxt) ? ' ' : '';
    el.value = antes + sep + novoTxt + depois;
    el.dispatchEvent(new Event('input', { bubbles: true }));
  };
  const juntar = seg => {
    seg = pontuar(String(seg).trim()); if (!seg) return;
    const ctx = (antes + escrito).replace(/[ \t]+$/, '');
    if (!ctx) seg = seg.replace(/^\s+/, '');
    if (!seg) return;
    if (!ctx ||/[.?!\n]$/.test(ctx)) seg = seg.replace(/^(\s*)(\S)/, (m, a, b) => a + b.toUpperCase());
    seg = seg.replace(/([.?!][ \t]+|\n[ \t]*)(\S)/g, (m, a, b) => a + b.toUpperCase());
    escrito += (escrito && !/\s$/.test(escrito) && !/^[,.:?!\n]/.test(seg) ? ' ' : '') + seg;
  };
  mirar(alvo, usarCursor);

  // ---- reconhecimento de voz (usa o mesmo microfone da gravação quando o Chrome deixa) ----
  let rg = null, falhas = 0, inicio = 0, rgFim = null, fechado = false;
  const ligar = () => {
    if (!ativo || semTexto) return;
    rg = new SR(); rg.lang = 'pt-BR'; rg.interimResults = true; rg.maxAlternatives = 1;
    rg.continuous = !/Android/i.test(navigator.userAgent); // no Android, "continuous" repete frases; reiniciamos a cada frase
    rg.onresult = ev => {
      if (fechado) return;
      let p = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) juntar(r[0].transcript); else p += r[0].transcript;
      }
      parcial = p.trim() ? (escrito && !/\s$/.test(escrito) ? ' ' : '') + p.trim() : '';
      falhas = 0;
      if (aviso && !semTexto) { aviso = ''; desenhar(); }
      escrever();
    };
    rg.onerror = ev => {
      if (ev.error === 'no-speech' || ev.error === 'aborted') return;
      if (ev.error === 'network') { aviso = 'Sem internet: só o áudio está sendo gravado agora.'; desenhar(); return; }
      semTexto = true; aviso = 'O celular não deixou escrever enquanto grava. O áudio continua sendo gravado.'; desenhar();
    };
    rg.onend = () => {
      if (parcial && !fechado) { juntar(parcial); parcial = ''; escrever(); }
      if (rgFim) { rgFim(); rgFim = null; }
      if (!ativo || semTexto) return;
      falhas = Date.now() - inicio < 1500 ? falhas + 1 : 0;
      if (falhas > 8) { semTexto = true; aviso = 'Não deu para escrever agora. O áudio continua sendo gravado.'; desenhar(); return; }
      setTimeout(ligar, 200);
    };
    inicio = Date.now();
    try { rg.start(stream.getAudioTracks()[0]); } catch (x) { try { rg.start(); } catch (y) { semTexto = true; aviso = 'O celular não deixou escrever enquanto grava. O áudio continua sendo gravado.'; desenhar(); } }
  };

  // ---- ondas e cronômetro ----
  let actx = null, an = null, buf = null;
  const niveis = Array(30).fill(3);
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); an = actx.createAnalyser(); an.fftSize = 512; actx.createMediaStreamSource(stream).connect(an); buf = new Uint8Array(an.fftSize); } catch (x) { an = null; }
  const tique = setInterval(() => {
    const c = $('#crono', barra); if (c) c.textContent = durTxt(Date.now() - t0);
    if (!an) return;
    an.getByteTimeDomainData(buf); let s = 0; for (const v of buf) s += (v - 128) ** 2;
    niveis.push(Math.max(3, Math.min(26, Math.sqrt(s / buf.length) * 1.8))); niveis.shift();
    $$('.ondas i', barra).forEach((b, i) => { b.style.height = niveis[i] + 'px'; });
  }, 100);

  // Durante a gravação, tocar num campo só muda onde o texto entra (sem abrir o teclado).
  const toque = e => {
    const x = e.target.closest('input,textarea');
    if (!ativo || !ditavel(x) || x === el) return;
    // A frase que está sendo dita agora vai para o campo novo (o resultado final chega depois).
    e.preventDefault(); if (parcial) { parcial = ''; escrever(); }
    mirar(x, false);
  };
  form.addEventListener('pointerdown', toque, true);

  let parando = null;
  function parar() {
    if (parando) return parando;
    ativo = false;
    parando = (async () => {
      clearInterval(tique); form.removeEventListener('pointerdown', toque, true);
      try { rg?.stop(); } catch (x) {}
      // Espera o resultado final da última frase (o Chrome entrega depois do stop) antes de fechar.
      if (parcial && rg) await new Promise(ok => { const t = setTimeout(ok, 1500); rgFim = () => { clearTimeout(t); ok(); }; });
      fechado = true;
      if (parcial) { juntar(parcial); parcial = ''; escrever(); }
      el?.classList.remove('ditando');
      if (rec.state !== 'inactive') { try { rec.requestData(); } catch (x) {} rec.stop(); }
      await fim;
      stream.getTracks().forEach(tr => tr.stop());
      try { actx?.close(); } catch (x) {}
      try { await trava?.release(); } catch (x) {}
      const ms = Date.now() - t0;
      ditado = null;
      if (pedacos.length && ms > 800) {
        const blob = new Blob(pedacos, { type: (rec.mimeType || tipo || 'audio/webm').split(';')[0] });
        const ant = novo ? null : await AUD.get(esbId);
        try { await AUD.put({ id: esbId, clips: [...(ant?.clips || []), { blob, ms }] }); aoGravar?.(); toast('Áudio guardado · ' + durTxt(audTotal(ant) + ms)); }
        catch (x) { toast('Não deu para guardar o áudio. A memória do celular está cheia?'); }
      }
      aoParar?.();
    })();
    return parando;
  }
  ditado = { parar };
  rec.start(1000);
  ligar();
}

/* Toca os clips de um esboço em sequência, como um áudio só. */
function montarOuvir(e, cont) {
  AUD.get(e.id).then(rec => {
    if (!rec?.clips?.length || !document.contains(cont)) return;
    const total = audTotal(rec);
    let vel = +LS.get('mp_vel') || 1, i = 0, au = null, url = null, tocando = false;
    cont.innerHTML = `<div class="ouvir"><div class="lin"><button class="tocar" id="tocar" aria-label="Ouvir">${IC.play}</button>
      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:15px;margin-bottom:7px">Ouvir para estudar</div><div class="barra"><i id="prog"></i></div></div>
      <span class="tempo" id="tempo">${durTxt(total)}</span></div>
      <div class="vel">${[1, 1.25, 1.5, 2].map(v => `<button data-vel="${v}" class="${vel === v ? 'on' : ''}">${String(v).replace('.', ',')}x</button>`).join('')}<button class="volta" id="volta">↺ 10 s</button></div></div>`;
    const ui = () => { const b = $('#tocar', cont); if (b) b.innerHTML = tocando ? IC.pausa : IC.play; };
    const pos = () => rec.clips.slice(0, i).reduce((s, c) => s + c.ms, 0) + (au ? au.currentTime * 1000 : 0);
    const mostra = () => { const p = Math.min(pos(), total); const g = $('#prog', cont), tm = $('#tempo', cont); if (g) g.style.width = (p / total * 100) + '%'; if (tm) tm.textContent = durTxt(p) + ' / ' + durTxt(total); };
    const carregar = k => {
      if (au) au.pause(); if (url) URL.revokeObjectURL(url);
      i = k; url = URL.createObjectURL(rec.clips[k].blob); au = new Audio(url);
      au.preservesPitch = true; au.defaultPlaybackRate = au.playbackRate = vel;
      au.ontimeupdate = mostra;
      au.onended = () => {
        if (i + 1 < rec.clips.length) { carregar(i + 1); au.play(); return; }
        tocando = false; carregar(0); ui(); const g = $('#prog', cont); if (g) g.style.width = '0'; const tm = $('#tempo', cont); if (tm) tm.textContent = durTxt(total);
      };
    };
    $('#tocar', cont).onclick = async () => {
      if (!au) carregar(0);
      if (tocando) { au.pause(); tocando = false; }
      else {
        try { await au.play(); tocando = true; } catch (x) { toast('Não deu para tocar o áudio'); }
        if ('mediaSession' in navigator) try { navigator.mediaSession.metadata = new MediaMetadata({ title: e.titulo, artist: 'Púlpito' }); } catch (x) {}
      }
      ui();
    };
    $$('[data-vel]', cont).forEach(b => b.onclick = () => {
      vel = +b.dataset.vel; LS.set('mp_vel', String(vel)); if (au) au.playbackRate = vel;
      $$('[data-vel]', cont).forEach(x => x.classList.toggle('on', x === b));
    });
    $('#volta', cont).onclick = () => { if (au) { au.currentTime = Math.max(0, au.currentTime - 10); mostra(); } };
    tocador = { fechar() { if (au) au.pause(); if (url) URL.revokeObjectURL(url); au = null; tocador = null; } };
  });
}
async function enviarAudio(e) {
  const rec = await AUD.get(e.id); if (!rec?.clips?.length) return toast('Este esboço não tem áudio');
  const ext = t => /mp4|aac|m4a/.test(t) ? 'm4a' : /ogg/.test(t) ? 'ogg' : 'weba';
  const nome = (e.titulo.replace(/[\\/:*?"<>|]+/g, '').trim() || 'esboco').slice(0, 60);
  const files = rec.clips.map((c, k) => new File([c.blob], `${nome}${rec.clips.length > 1 ? ' - parte ' + (k + 1) : ''}.${ext(c.blob.type)}`, { type: c.blob.type || 'audio/webm' }));
  if (navigator.canShare?.({ files })) { try { await navigator.share({ files, title: e.titulo }); } catch (x) {} return; }
  files.forEach(f => baixar(f.name, f, f.type));
}

function textoEsboco(e) {
  const L = [e.titulo.toUpperCase()];
  if (e.texto) L.push('Texto: ' + e.texto);
  if (e.tema) L.push('Tema: ' + e.tema);
  L.push('');
  if (e.introducao) L.push('INTRODUÇÃO', e.introducao, '');
  e.topicos.forEach((tp, i) => { L.push(`${i + 1}. ${tp.titulo}`); if (tp.versiculos) L.push('   ' + tp.versiculos); if (tp.conteudo) L.push(tp.conteudo); L.push(''); });
  SECOES.forEach(([k, rot]) => { if (e[k]) L.push(rot.toUpperCase(), e[k], ''); });
  return L.join('\n').trim();
}

/* ================= Modo púlpito ================= */
function abrirPulpito(e) {
  const slides = [{ capa: true, h: e.titulo, sub: [e.texto, e.tema].filter(Boolean).join(' · '), refs: lerRefs(e.texto).slice(0, 1) }];
  if (e.introducao) slides.push({ rot: 'Introdução', body: e.introducao });
  e.topicos.forEach((tp, i) => slides.push({ rot: `Tópico ${i + 1} de ${e.topicos.length}`, h: tp.titulo, vers: tp.versiculos, refs: lerRefs(tp.versiculos), body: tp.conteudo }));
  SECOES.forEach(([k, rot]) => { if (e[k]) slides.push({ rot, body: e[k] }); });
  let i = 0, fonte = +LS.get('mp_fonte') || 28, escuro = LS.get('mp_pulpito') !== 'claro', trava = null, vez = 0;
  const inicio = Date.now();
  const el = document.createElement('div'); el.id = 'pulpito'; el.classList.toggle('escuro', escuro);
  el.innerHTML = `<div class="p-top"><button data-a="sair" aria-label="Sair">✕</button><div class="p-info"><span id="p-hora"></span><span id="p-tempo"></span></div>
      <button data-a="menos" aria-label="Diminuir letra">A−</button><button data-a="mais" aria-label="Aumentar letra">A+</button><button data-a="tema" aria-label="Claro ou escuro">◐</button></div>
    <div class="p-barra"><i id="p-prog"></i></div>
    <div class="p-corpo" id="p-corpo"></div>
    <div class="p-pe"><button data-a="ant">‹ Voltar</button><span id="p-n"></span><button data-a="prox" class="pri">Avançar ›</button></div>`;
  document.body.append(el); document.body.classList.add('travado');
  const corpo = $('#p-corpo', el);
  const mostra = async () => {
    const s = slides[i], minha = ++vez;
    el.style.setProperty('--pf', fonte + 'px');
    corpo.innerHTML = s.capa
      ? `<div class="p-capa"><h2>${esc(s.h)}</h2>${s.sub ? `<div class="p-vers">${esc(s.sub)}</div>` : ''}<div id="p-txt"></div></div>`
      : `<div class="p-rot">${esc(s.rot)}</div>${s.h ? `<h2>${esc(s.h)}</h2>` : ''}${s.vers ? `<div class="p-vers">${esc(s.vers)}</div>` : ''}<div id="p-txt"></div>${s.body ? `<p class="b">${esc(s.body)}</p>` : ''}`;
    corpo.scrollTop = 0;
    $('#p-n', el).textContent = `${i + 1} / ${slides.length}`;
    $('#p-prog', el).style.width = ((i + 1) / slides.length * 100) + '%';
    $('[data-a=ant]', el).disabled = i === 0; $('[data-a=prox]', el).disabled = i === slides.length - 1;
    if (s.refs && s.refs.length) {
      try {
        const partes = [];
        for (const r of s.refs.slice(0, 4)) { const vs = await versos(r); if (vs.length) partes.push(`<div class="p-texto">${s.refs.length > 1 ? `<b style="font-family:Inter,sans-serif;font-size:.8em">${esc(r.rotulo)}</b><br>` : ''}${versosHtml(vs.slice(0, 8))}${vs.length > 8 ? '…' : ''}</div>`); }
        if (minha === vez && $('#p-txt', el)) $('#p-txt', el).innerHTML = partes.join('');
      } catch (x) { /* sem a Bíblia, mostra só a referência */ }
    }
  };
  const relogio = () => {
    const d = new Date(), s = Math.floor((Date.now() - inicio) / 1000);
    $('#p-hora', el).textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('#p-tempo', el).textContent = '⏱ ' + Math.floor(s / 60) + ':' + pad(s % 60);
  };
  const vai = n => { i = Math.max(0, Math.min(slides.length - 1, i + n)); mostra(); };
  const pedeTrava = async () => { try { trava = await navigator.wakeLock?.request('screen'); } catch (x) { trava = null; } };
  const vis = () => { if (document.visibilityState === 'visible') pedeTrava(); };
  const teclas = ev => {
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(ev.key)) { ev.preventDefault(); vai(1); }
    else if (['ArrowLeft', 'PageUp'].includes(ev.key)) { ev.preventDefault(); vai(-1); }
    else if (ev.key === 'Escape') history.back();
  };
  let x0 = null, y0 = null;
  corpo.addEventListener('pointerdown', ev => { x0 = ev.clientX; y0 = ev.clientY; });
  corpo.addEventListener('pointerup', ev => {
    if (x0 == null) return;
    const dx = ev.clientX - x0, dy = ev.clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) vai(dx < 0 ? 1 : -1);
    else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) vai(ev.clientX < innerWidth * 0.3 ? -1 : 1);
  });
  el.addEventListener('click', ev => {
    const a = ev.target.closest('[data-a]')?.dataset.a; if (!a) return;
    if (a === 'sair') history.back();
    else if (a === 'prox') vai(1); else if (a === 'ant') vai(-1);
    else if (a === 'mais' || a === 'menos') { fonte = Math.max(18, Math.min(54, fonte + (a === 'mais' ? 3 : -3))); LS.set('mp_fonte', fonte); mostra(); }
    else if (a === 'tema') { escuro = !escuro; el.classList.toggle('escuro', escuro); LS.set('mp_pulpito', escuro ? 'escuro' : 'claro'); }
  });
  const timer = setInterval(relogio, 1000);
  const fecha = () => {
    clearInterval(timer); trava?.release?.().catch(() => {});
    document.removeEventListener('visibilitychange', vis); removeEventListener('keydown', teclas);
    el.remove(); document.body.classList.remove('travado');
  };
  history.pushState({ pulpito: 1 }, '');
  addEventListener('popstate', fecha, { once: true });
  document.addEventListener('visibilitychange', vis); addEventListener('keydown', teclas);
  pedeTrava(); relogio(); mostra();
}

    <div class="conv-h"><div class="q">${quando(c.data)}${c.status !== 'confirmado' ? ' · ' + statusTxt(c) : ''}</div><h2>${esc(c.igreja)}</h2>
      <div class="d cap">${fmtData(c.data, true)}${c.hora ? ' · ' + esc(c.hora) : ''} · ${esc(c.tipo)}</div></div>
    ${cf.length ? `<p class="nota perigo" style="margin-top:12px">Conflito de horário com ${cf.map(x => `<a href="#/convite/${x.id}" style="text-decoration:underline">${esc(x.igreja)}${x.hora ? ' às ' + esc(x.hora) : ''}</a>`).join(', ')}.</p>` : ''}
    <div class="botoes">
      ${tel ? `<a class="btn" href="https://wa.me/${tel}" target="_blank" rel="noopener">${IC.whats}WhatsApp</a><a class="btn" href="tel:+${tel}">${IC.fone}Ligar</a>` : ''}
      ${local ? `<a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(local)}" target="_blank" rel="noopener">${IC.mapa}Como chegar</a>` : ''}
      <button class="btn" id="ics">${IC.sino}Lembrete</button>
    </div>
    <div class="rot">Mensagem</div>
    ${e ? `<a class="linha" href="#/esboco/${e.id}" style="padding-top:6px"><div class="info"><div class="t">${esc(e.titulo)}</div>${e.texto ? `<div class="ref">${esc(e.texto)}</div>` : ''}</div><span class="azul">${IC.dir}</span></a>
      ${ja.length ? `<p class="nota warn">Você já pregou este esboço aqui em ${fmtData(ja[0].data)}.</p>` : ''}
      <button class="btn pri bloco" id="abre-pulpito" style="margin-top:12px">${IC.play}Abrir no modo púlpito</button>`
    : `<p class="muted">Esboço ainda não escolhido.</p><a class="lnk" href="#/convite/${c.id}/editar">Escolher esboço</a>`}
    ${c.temaEvento ? `<div class="dado" style="margin-top:8px"><div class="r">Tema pedido</div><div class="v">${esc(c.temaEvento)}</div></div>` : ''}
    ${(local || c.contato || c.telefone || c.obs) ? `<div class="rot">Detalhes</div>${dado('Endereço', local)}${dado('Contato', c.contato)}${dado('Telefone', c.telefone)}${dado('Observações', c.obs)}` : ''}
    <div class="form" style="margin-top:24px">
      ${c.status !== 'realizado' && c.status !== 'cancelado' ? `<button class="btn bloco" id="realizado">${IC.check}Marcar como realizado</button>` : ''}
      <a class="btn bloco" href="#/convite/${c.id}/editar">${IC.editar}Editar convite</a>
      <button class="lnk perigo" id="excluir" style="justify-content:center">Excluir convite</button>
    </div>`, { voltar: '#/agenda' });
  $('#ics', t).onclick = () => lembrete(c);
  $('#abre-pulpito', t) && ($('#abre-pulpito', t).onclick = () => abrirPulpito(e));
  $('#realizado', t) && ($('#realizado', t).onclick = () => { c.status = 'realizado'; salvar(); toast('Marcado como realizado'); telaVerConvite(id); });
  $('#excluir', t).onclick = async () => {
    if (!await confirmar(`Excluir o convite de ${c.igreja}?`, { titulo: 'Excluir convite', ok: 'Excluir', perigo: true })) return;
    db.convites = db.convites.filter(x => x.id !== id); salvar(); toast('Convite excluído'); location.replace('#/agenda');
  };
}

/* ================= Ajustes ================= */
function telaAjustes() {
  const ult = db.ultimoBackup ? new Date(db.ultimoBackup) : null;
  const t = tela('Ajustes', `
    <div class="form" style="margin-top:6px">
      <label class="campo"><span>Seu nome</span><input id="nome" value="${esc(db.nome)}" placeholder="Pra. Tamires"></label>
      <div class="campo"><span>Aparência</span><div class="sub" style="margin:0">${[['auto', 'Automático'], ['light', 'Claro'], ['dark', 'Escuro']].map(([k, v]) => `<button data-tema="${k}" class="${db.tema === k ? 'on' : ''}">${v}</button>`).join('')}</div></div>
    </div>
    <div class="rot">Cópia de segurança</div>
    <p class="muted">Seus esboços e convites ficam guardados só neste celular. Faça uma cópia de vez em quando e guarde no Google Drive, no e-mail ou no WhatsApp. Ela também passa tudo para um celular novo.</p>
    <p class="muted" style="margin-top:8px">Os áudios dos esboços não entram nesta cópia. Para guardar um áudio, abra o esboço, toque em ⋯ e depois em <b>Enviar o áudio</b>.</p>
    <p style="margin:10px 0 14px;font-weight:500">${ult ? 'Última cópia: ' + fmtData(isoDe(ult)) : 'Nenhuma cópia feita ainda.'}</p>
    <div class="form"><button class="btn pri bloco" id="backup">Fazer cópia de segurança</button>
      <label class="btn bloco" for="restaurar">Restaurar uma cópia</label><input type="file" id="restaurar" accept="application/json,.json" hidden></div>
    <div class="rot">Instalar no celular</div>
    <p><b style="font-weight:600">Android:</b> no Chrome, toque nos 3 pontinhos ⋮ e em Adicionar à tela inicial.</p>
    <p style="margin-top:6px"><b style="font-weight:600">iPhone:</b> no Safari, toque em compartilhar e em Adicionar à Tela de Início.</p>
    <p class="muted" style="margin-top:6px">Depois de aberto uma vez, funciona sem internet, inclusive a Bíblia.</p>
    <div class="rot">Bíblia</div>
    ${CREDITOS.replace('class="creditos"', 'class="creditos" style="margin-top:0"')}
    <div class="rot">Zona de perigo</div>
    <button class="lnk perigo" id="apagar">${IC.lixo}Apagar todos os dados</button>
    <p class="muted" style="text-align:center;font-size:13px;margin-top:24px">Púlpito da Tamires · ${db.esbocos.length} esboços · ${db.convites.length} convites</p>`, { voltar: '#/inicio' });
  $('#nome', t).addEventListener('change', e => { db.nome = e.target.value.trim(); salvar(); toast('Nome salvo'); });
  $$('[data-tema]', t).forEach(b => b.onclick = () => { db.tema = b.dataset.tema; salvar(); aplicarTema(); telaAjustes(); });
  $('#backup', t).onclick = async () => {
    const dados = JSON.stringify({ ...db, app: 'pulpito-tamires', exportado: new Date().toISOString() }, null, 1);
    const nome = `pulpito-tamires-copia-${hojeISO()}.json`;
    const arq = new File([dados], nome, { type: 'application/json' });
    let ok = false;
    if (matchMedia('(pointer:coarse)').matches && navigator.canShare?.({ files: [arq] })) {
      try { await navigator.share({ files: [arq], title: 'Cópia do Púlpito da Tamires' }); ok = true; } catch (x) { if (x.name === 'AbortError') return; }
    }
    if (!ok) baixar(nome, dados, 'application/json');
    db.ultimoBackup = Date.now(); salvar(); toast('Cópia criada'); telaAjustes();
  };
  $('#restaurar', t).onchange = async e => {
    const arq = e.target.files[0]; if (!arq) return;
    try {
      const d = JSON.parse(await arq.text());
      if (!Array.isArray(d.esbocos) || !Array.isArray(d.convites)) throw new Error('formato');
      if (!await confirmar(`Esta cópia tem ${d.esbocos.length} esboços e ${d.convites.length} convites. Ela vai substituir tudo o que está no celular agora.`, { titulo: 'Restaurar cópia', ok: 'Restaurar' })) return;
      delete d.app; delete d.exportado; db = d; db.exemploCriado = true; salvar(); aplicarTema(); toast('Cópia restaurada'); location.hash = '#/inicio';
    } catch (x) { toast('Este arquivo não é uma cópia do Púlpito da Tamires'); }
    e.target.value = '';
  };
  $('#apagar', t).onclick = async () => {
    if (!await confirmar('Todos os esboços e convites deste celular serão apagados. Faça uma cópia antes, se quiser guardar.', { titulo: 'Apagar tudo', ok: 'Apagar tudo', perigo: true })) return;
    db = { nome: db.nome, tema: db.tema, esbocos: [], convites: [], ultimoBackup: null, exemploCriado: true }; salvar(); toast('Dados apagados'); location.hash = '#/inicio';
  };
}

/* ================= início do app ================= */
carregar(); aplicarTema();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', aplicarTema);
$('#livros').innerHTML = LIVROS.map(l => `<option value="${l} ">`).join('');
if (!location.hash) location.replace('#/inicio');
rotear();
try { navigator.storage?.persist?.(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
